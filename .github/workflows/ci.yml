name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Activate the locked package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formatting and documentation
        run: |
          pnpm format:check
          pnpm docs:check
      - name: Verify lint, types, tests and production builds
        run: |
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Verify package and public-tree boundaries
        run: |
          pnpm test:package
          pnpm test:source
          pnpm test:release:tooling
          pnpm test:public-repository
          pnpm check:public-repository
      - name: Verify reference boundaries and unit lanes
        run: |
          pnpm reference:snippets:check
          pnpm reference:test:boundaries
          pnpm reference:test:unit
          pnpm reference:standard:test:unit
      - name: Record the browser-lane boundary
        run: echo "Browser E2E remains a separately observed release lane until a hosted runner is reviewed."

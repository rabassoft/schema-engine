name: Npm publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: Accepted future release descriptor identifier
        required: true
        type: string
      source_commit:
        description: Exact protected main commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the trusted-publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify the protected source identity
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$REQUESTED_SOURCE"
          test "$(printf '%s' "$REQUESTED_SOURCE" | wc -c | tr -d ' ')" = "40"
          test -z "$(printf '%s' "$REQUESTED_SOURCE" | tr -d '0-9a-f')"
      - name: Activate reviewed package tooling
        run: |
          npm install --global npm@11.18.0
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the complete release-independent matrix
        run: |
          pnpm format:check
          pnpm docs:check
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:package
          pnpm test:source
          pnpm test:release:tooling
          pnpm test:public-repository
          pnpm check:public-repository
          pnpm reference:snippets:check
          pnpm reference:test:boundaries
          pnpm reference:test:unit
          pnpm reference:standard:test:unit

  stage:
    name: stage
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the trusted-publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Activate reviewed package tooling
        run: |
          npm install --global npm@11.18.0
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fail closed unless a future descriptor and exact source authorize OIDC
        env:
          RELEASE_DESCRIPTOR: ${{ inputs.release }}
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: node scripts/verify-npm-publish-readiness.mjs --release="$RELEASE_DESCRIPTOR" --source-commit="$REQUESTED_SOURCE"
      - name: Rebuild and verify publishable package directories
        run: |
          pnpm build
          pnpm test:package
          pnpm test:source
      - name: Prepare deterministic M23 candidates
        run: node scripts/prepare-public-candidates.mjs --release=m23
      - name: Stage the reviewed dependency-first tarball sequence
        run: |
          npm stage publish .release/0.4.1/rabassoft-schema-engine-0.4.1.tgz --access public --tag next
          npm stage publish .release/0.4.1/rabassoft-schema-engine-angular-0.4.1.tgz --access public --tag next
          npm stage publish .release/0.4.1/rabassoft-schema-engine-angular-aria-0.2.1.tgz --access public --tag next
